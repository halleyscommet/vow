# pushing a tag like v1.0.3 builds the plugin and attaches the jar to a GitHub release,
# which /vow admin update then downloads. The resource pack zip is attached too, and the plugin
# sends players that release's copy.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build
        run: |
          # the pom's version has to match the tag - bump it in the commit you tag
          pom_version=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "$pom_version" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::pom.xml version is $pom_version but the tag is $GITHUB_REF_NAME"
            exit 1
          fi
          mvn -B package

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            target/VowSMPPlugin-*.jar
            target/VowResourcePack.zip
          generate_release_notes: true
