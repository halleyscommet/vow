leaderboard-enabled: false
# player kills are only counted while this is on
kills-leaderboard-enabled: false

update-repo: "halleyscommet/vow"

# source: "release" sends the pack attached to this version's GitHub release (built from resourcepack/),
#         "config" sends the pack at url below (hash is its sha1, optional but lets clients cache it)
resource-pack:
  source: "release"
  url: ""
  hash: ""

logged-players: []
killed-players: []
player-lives: {}
# uuid -> player kills counted while the kills leaderboard was on
player-kills: {}
# each life count here unlocks one more vow slot while a player has at least that many lives.
# Everyone gets 1 slot; dropping below a count takes away their newest vow.
extra-vow-lives: [7]
# uuid -> list of vow ids, oldest first
player-vows: {}
# guru uuid -> uuids of players his smite never targets (/vow trust)
guru-trusted: {}
# mythic item uuid -> name (MiniMessage) and holder uuid. Managed with /vow admin makemythic
mythics: {}
# cooldown group -> when it ends (epoch millis), for items with the cooldown ability. Managed by the plugin.
item-cooldowns: {}
# what happens when a mythic changes hands
mythic-transfer:
  broadcast: true
  sound: true
