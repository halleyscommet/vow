leaderboard-enabled: false
# player kills are only counted while this is on
kills-leaderboard-enabled: false

update-repo: "halleyscommet/vow"

# source: "release" sends the pack attached to this version's GitHub release (built from resourcepack/),
#         "config" sends the pack at url below (hash is its sha1, optional but lets clients cache it)
resource-pack:
  source: "release"
  url: ""
  hash: ""

logged-players: []
killed-players: []
player-lives: {}
# uuid -> player kills counted while the kills leaderboard was on
player-kills: {}
# each life count here unlocks one more vow slot while a player has at least that many lives.
# Everyone gets 1 slot; dropping below a count takes away their newest vow.
extra-vow-lives: [7]
# uuid -> list of vow ids, oldest first
player-vows: {}
# guru uuid -> uuids of players his smite never targets (/vow trust)
guru-trusted: {}
# same for the Guru 2 vow
guru2-trusted: {}
# easter egg blocks that puff smoke and clang ("world,x,y,z"), every interval ticks. Managed with /steam
steam:
  interval: 30
  sources: []
# /ai chatbot. Get a key at https://aistudio.google.com/apikey - or leave it empty and set the
# GEMINI_API_KEY environment variable instead.
gemini:
  api-key: ""
  model: "gemini-2.5-flash"
  # the bot's personality and rules. %player% is replaced with the player's name. The server's rules, every
  # vow's description, mythic holders and the player's own lives and vows are added after this automatically.
  system-prompt: |-
    You answer questions in the chat of Vow SMP, a private, whitelisted Minecraft survival server. Players reach you
    with /ai, and right now %player% is asking. You have no name and no persona - never give yourself one.

    Vow SMP is a lives-and-vows server: everyone has a limited number of lives, and players take vows - pacts that
    give a power with a price. Below is how the server works, every vow, and what you know about %player%.

    How to answer:
    - Keep it short. Your reply shows up in Minecraft chat, so 1-3 sentences is ideal; only go longer when asked.
    - Plain text only. No markdown, bullet lists, headings or emoji.
    - Be blunt, curt and unfriendly. No greetings, no pleasantries, no encouragement, no exclamation marks, no
      offering further help. Just give the answer, with dry indifference. Still answer correctly.
    - Use the server info below as the truth about this server. If it doesn't say, say you don't know rather than
      inventing a rule or a number. For ordinary Minecraft questions (crafting, mobs, redstone, enchants), answer
      from what you know about Minecraft Java Edition 1.21.
    - You only know %player%'s own vows and lives, not anyone else's - who has which vow is part of the game, so
      don't guess. If asked, say it's a secret.
    - You can't run commands, change lives, give items or hand out vows. Vows come from the admins.
    - If someone asks for strategy, give honest, practical tips based on their vows and lives.
  # how many past exchanges each player's conversation remembers
  history: 10
  # how long a player waits between messages
  cooldown-seconds: 5
# mythic item uuid -> name (MiniMessage) and holder uuid. Managed with /vow admin makemythic
mythics: {}
# cooldown group -> when it ends (epoch millis), for items with the cooldown ability. Managed by the plugin.
item-cooldowns: {}
# what happens when a mythic changes hands
mythic-transfer:
  broadcast: true
  sound: true
