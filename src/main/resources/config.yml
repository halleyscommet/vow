leaderboard-enabled: false

update-repo: "halleyscommet/vow"

# source: "release" sends the pack attached to this version's GitHub release (built from resourcepack/),
#         "config" sends the pack at url below (hash is its sha1, optional but lets clients cache it)
resource-pack:
  source: "release"
  url: ""
  hash: ""

logged-players: []
killed-players: []
player-lives: {}
player-vows: {}
# guru uuid -> uuids of players his smite never targets (/vow trust)
guru-trusted: {}
# mythic item uuid -> name (MiniMessage) and holder uuid. Managed with /vow admin makemythic
mythics: {}
# what happens when a mythic changes hands
mythic-transfer:
  broadcast: true
  sound: true
